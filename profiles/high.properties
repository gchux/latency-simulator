app.startup.latency.enabled=true
app.startup.latency.min=8
app.startup.latency.max=20

app.coldstart.spikeFactor=4

# properties for root endpoint: `/`
app.response.code._root_=200
app.response.latency.enabled._root_=true
app.response.latency.min._root_=4
app.response.latency.max._root_=12
app.response.latency.spikeFactor._root_=4

app.initialization.latency.enabled=true
app.initialization.latency.min=4
app.initialization.latency.max=12
app.initialization.latency.spikeFactor=4

app.web.requests.pendingLatency.max=300
app.web.requests.concurrency.min=10
app.web.requests.concurrency.max=80
